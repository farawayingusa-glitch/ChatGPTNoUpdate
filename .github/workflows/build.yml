name: Build Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install make ldid dpkg

      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Download classic iOS SDK (provides private frameworks)
        run: |
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          mkdir -p "$THEOS/sdks"
          tar -xf /tmp/sdks.tar.gz -C "$THEOS/sdks" --strip-components=1 sdks-master/iPhoneOS16.5.sdk
          echo "=== SDK root ==="
          ls "$THEOS/sdks"
          echo "=== SDK size ==="
          du -sh "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "=== Preferences framework ==="
          find "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library" -maxdepth 2 -iname "Preferences*"

      - name: Build rootless .deb
        run: |
          gmake clean || true
          gmake package FINALPACKAGE=1

      - name: Repackage with gzip (Sileo compatibility)
        run: |
          mkdir -p dist
          for deb in packages/*.deb; do
            base=$(basename "$deb")
            tmp=$(mktemp -d)
            dpkg-deb -R "$deb" "$tmp/x"
            dpkg-deb -Zgzip --build "$tmp/x" "dist/$base"
            rm -rf "$tmp"
            echo "rebuilt: $base"
          done
          echo "=== verify info ==="
          dpkg-deb --info dist/*.deb
          echo "=== verify contents ==="
          dpkg-deb --contents dist/*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTNoUpdate-deb
          path: dist/*.deb
