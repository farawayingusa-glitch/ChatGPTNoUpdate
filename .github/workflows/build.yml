name: Build Tweak

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install make ldid dpkg

      - name: Clone Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Build rootless .deb
        run: |
          gmake clean || true
          gmake package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTNoUpdate-deb
          path: packages/*.deb
